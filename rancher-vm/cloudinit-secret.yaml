apiVersion: v1
kind: Secret
metadata:
  name: rancher-cloudinit
  namespace: default
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: rancher
    users:
      - name: ubuntu
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-rsa 
    write_files:
      - path: /etc/netplan/99-static.yaml
        owner: root:root
        permissions: '0600'
        content: |
          network:
            version: 2
            ethernets:
              enp1s0:
                dhcp4: false
                addresses:
                  - 192.168.1.2/24
                routes:
                  - to: default
                    via: 192.168.1.1
                nameservers:
                  addresses:
                    - 8.8.8.8
                    - 1.1.1.1
    packages:
      - qemu-guest-agent
    runcmd:
      - systemctl enable --now qemu-guest-agent
      - netplan apply
      - curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--tls-san=51.38.122.163 --write-kubeconfig-mode=644" sh -
      - until kubectl get nodes | grep -q " Ready"; do sleep 5; done
      - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
      - until kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=300s; do sleep 10; done
      - KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm repo add rancher-latest https://releases.rancher.com/server-charts/latest
      - KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm repo update
      - KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm install rancher rancher-latest/rancher -n cattle-system --create-namespace --set hostname=rancher.51.38.122.163.sslip.io --set bootstrapPassword=admin --set replicas=1
      - until KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get crd gitrepos.fleet.cattle.io 2>/dev/null; do sleep 10; done
      - |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f - <<GITREPO
        apiVersion: fleet.cattle.io/v1alpha1
        kind: GitRepo
        metadata:
          name: harvesterpoc
          namespace: fleet-local
        spec:
          repo: https://github.com/SantoDE/harvesterpoc
          branch: main
          paths:
            - workload-cluster
          targets:
            - clusterSelector: {}
        GITREPO
