apiVersion: v1
kind: Secret
metadata:
  name: traefik-addon
  namespace: k3k-rancher
type: Opaque
stringData:
  traefik.yaml: |
    apiVersion: helm.cattle.io/v1
    kind: HelmChartConfig
    metadata:
      name: traefik
      namespace: kube-system
    spec:
      valuesContent: |-
        service:
          type: NodePort
        ports:
          web:
            nodePort: 30080
          websecure:
            nodePort: 30444
