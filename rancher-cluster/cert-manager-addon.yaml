apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-addon
  namespace: k3k-rancher
type: Opaque
stringData:
  cert-manager.yaml: |
    apiVersion: helm.cattle.io/v1
    kind: HelmChart
    metadata:
      name: cert-manager
      namespace: kube-system
    spec:
      repo: https://charts.jetstack.io
      chart: cert-manager
      version: v1.17.2
      targetNamespace: cert-manager
      createNamespace: true
      set:
        crds.enabled: "true"
