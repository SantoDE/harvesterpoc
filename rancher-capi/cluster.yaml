---
apiVersion: v1
kind: Secret
metadata:
  name: harvester-kubeconfig
  namespace: default
type: Opaque
data:
  kubeconfig: 
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HarvesterCluster
metadata:
  name: workload
  namespace: default
spec:
  targetNamespace: default
  identitySecret:
    namespace: default
    name: harvester-kubeconfig
  loadBalancerConfig:
    ipamType: pool
    ipPool:
      vmNetwork: default/vlan-mgmt
      subnet: 51.38.122.160/29
      gateway: 51.38.122.166
      rangeStart: 51.38.122.164
      rangeEnd: 51.38.122.164
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: workload
  namespace: default
spec:
  controlPlaneEndpoint:
    host: 51.38.122.164
    port: 6443
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: HarvesterCluster
    name: workload
    namespace: default
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: RKE2ControlPlane
    name: workload-cp
    namespace: default
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HarvesterMachineTemplate
metadata:
  name: workload-cp-machine
  namespace: default
spec:
  template:
    spec:
      cpu: 2
      memory: 4Gi
      sshUser: ubuntu
      sshKeyPair: default/personal
      networks:
        - default/vlan-mgmt
      volumes:
        - volumeType: image
          imageName: default/image-2qvbl
          volumeSize: 20Gi
          bootOrder: 1
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: RKE2ControlPlane
metadata:
  name: workload-cp
  namespace: default
spec:
  replicas: 1
  version: v1.31.6+rke2r1
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: HarvesterMachineTemplate
      name: workload-cp-machine
      namespace: default
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  serverConfig:
    tlsSan:
      - 51.38.122.164
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HarvesterMachineTemplate
metadata:
  name: workload-worker-machine
  namespace: default
spec:
  template:
    spec:
      cpu: 2
      memory: 4Gi
      sshUser: ubuntu
      sshKeyPair: default/personal
      networks:
        - default/vlan-mgmt
      volumes:
        - volumeType: image
          imageName: default/image-2qvbl
          volumeSize: 20Gi
          bootOrder: 1
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: RKE2ConfigTemplate
metadata:
  name: workload-worker-config
  namespace: default
spec:
  template:
    spec:
      agentConfig: {}
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: workload-workers
  namespace: default
spec:
  clusterName: workload
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      clusterName: workload
      version: v1.31.6+rke2r1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: RKE2ConfigTemplate
          name: workload-worker-config
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: HarvesterMachineTemplate
        name: workload-worker-machine
