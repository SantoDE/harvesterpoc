apiVersion: rke-machine-config.cattle.io/v1
kind: HarvesterConfig
metadata:
  name: workload-cp
  namespace: fleet-default
clusterName: workload
cpuCount: "2"
diskSize: "20"
imageName: default/image-2qvbl
memorySize: "4"
networkName: default/vlan-mgmt
networkData: |-
    version: 2
    ethernets:
      enp1s0:
        dhcp4: false
        addresses:
          - 192.168.1.3/24
        routes:
          - to: default
            via: 192.168.1.1
        nameservers:
          addresses:
            - 8.8.8.8
            - 1.1.1.1
sshUser: ubuntu
userData: |-
    #cloud-config
    users:
      - name: ubuntu
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-rsa 
    chpasswd:
      list: |
        ubuntu:harvester
      expire: false
    packages:
      - qemu-guest-agent
    runcmd:
      - systemctl enable --now qemu-guest-agent
---
apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: workload
  namespace: fleet-default
spec:
  kubernetesVersion: v1.32.4+k3s1
  rkeConfig:
    machineGlobalConfig:
      tls-san:
        - 51.38.122.164
        - 192.168.1.3
    machinePools:
      - name: cp-pool
        controlPlaneRole: true
        etcdRole: true
        workerRole: true
        quantity: 1
        cloudCredentialSecretName: cattle-global-data:cc-8ljnf
        machineConfigRef:
          apiVersion: rke-machine-config.cattle.io/v1
          kind: HarvesterConfig
          name: workload-cp
