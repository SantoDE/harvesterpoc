apiVersion: rke-machine-config.cattle.io/v1
kind: HarvesterConfig
metadata:
  name: rke2-test-cp
  namespace: fleet-default
clusterName: rke2-test
cpuCount: "4"
diskSize: "20"
imageName: default/image-2qvbl
memorySize: "8"
networkName: default/vlan-mgmt
networkData: |-
    version: 2
    ethernets:
      enp1s0:
        dhcp4: false
        addresses:
          - 192.168.1.20/24
        routes:
          - to: default
            via: 192.168.1.1
        nameservers:
          addresses:
            - 8.8.8.8
            - 1.1.1.1
sshUser: ubuntu
userData: |-
    #cloud-config
    users:
      - name: ubuntu
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-rsa 
    chpasswd:
      list: |
        ubuntu:harvester
      expire: false
    write_files:
      - encoding: b64
        content: 
        owner: root:root
        path: /etc/kubernetes/cloud-config
        permissions: '0644'
    runcmd:
      - until ping -c1 8.8.8.8 &>/dev/null; do sleep 2; done
      - apt-get update -y
      - apt-get install -y qemu-guest-agent
      - systemctl start qemu-guest-agent
---
apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: rke2-test
  namespace: fleet-default
spec:
  kubernetesVersion: v1.32.4+rke2r1
  cloudCredentialSecretName: cattle-global-data:cc-8ljnf
  rkeConfig:
    machineGlobalConfig:
      tls-san:
        - 192.168.1.20
      cloud-provider-name: harvester
    machineSelectorConfig:
      - config:
          protect-kernel-defaults: false
    machinePools:
      - name: cp-pool
        controlPlaneRole: true
        etcdRole: true
        workerRole: true
        quantity: 1
        cloudCredentialSecretName: cattle-global-data:cc-8ljnf
        machineConfigRef:
          apiVersion: rke-machine-config.cattle.io/v1
          kind: HarvesterConfig
          name: rke2-test-cp
