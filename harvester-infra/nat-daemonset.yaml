apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: private-network-setup
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: private-network-setup
  template:
    metadata:
      labels:
        app: private-network-setup
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      initContainers:
        - name: setup
          image: alpine
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              until ip link show mgmt-br > /dev/null 2>&1; do sleep 2; done
              ip addr add 192.168.1.1/24 dev mgmt-br 2>/dev/null || true
              sysctl -w net.ipv4.ip_forward=1
              iptables -t nat -C POSTROUTING -s 192.168.1.0/24 -o mgmt-br -j MASQUERADE 2>/dev/null || \
                iptables -t nat -A POSTROUTING -s 192.168.1.0/24 -o mgmt-br -j MASQUERADE
      containers:
        - name: pause
          image: alpine
          command: ["sleep", "infinity"]
