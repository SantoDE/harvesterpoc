apiVersion: v1
kind: ConfigMap
metadata:
  name: config-domain
  namespace: knative-serving
data:
  51.38.122.165.sslip.io: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-gateway
  namespace: knative-serving
data:
  external-gateways: |
    - class: traefik
      gateway: kube-system/traefik-gateway
      service: kube-system/traefik
      supported-features:
        - HTTPRouteRequestTimeout
        - HTTPRouteBackendTimeout
        - HTTPRouteResponseHeaderModification
  local-gateways: |
    - class: traefik
      gateway: knative-serving/knative-local-gateway
      service: kube-system/traefik
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: knative-local-gateway
  namespace: knative-serving
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-observability
  namespace: knative-serving
data:
  metrics.backend-destination: none
